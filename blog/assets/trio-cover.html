<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; width:1200px; height:630px; overflow:hidden; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    color:#1f2430;
    background:
      radial-gradient(700px 300px at 4% -10%, #fff1df 0%, transparent 65%),
      radial-gradient(700px 300px at 100% 0%, #e8f2ff 0%, transparent 60%),
      #fbfaf7;
  }
  .wrap { padding:58px 64px; }
  .eyebrow { font-size:12px; letter-spacing:.18em; text-transform:uppercase; font-weight:850; color:#9a6a3f; margin-bottom:16px; }
  h1 { font-size:76px; line-height:.9; letter-spacing:-.06em; margin:0 0 16px; font-weight:850; }
  .sub { font-size:20px; line-height:1.32; color:#444b5a; max-width:850px; margin:0 0 24px; }
  .grid { display:flex; flex-wrap:wrap; gap:9px; max-width:1050px; }
  .chip { background:#fff; border:1px solid #e7dfd3; border-radius:999px; padding:8px 12px; font-size:12px; font-weight:750; color:#4b3a29; }
  .chip b { color:#b4672d; }
  .foot { position:absolute; left:64px; bottom:32px; font-size:11px; color:#687083; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Qwen3.5-4B · three-neuron combos</div>
  <h1>Three-Neuron Bangers</h1>
  <p class="sub">Five combos that fuse into something none of the neurons does alone. Dose ≈ 0.6 each. 4-bit + 8-bit.</p>
  <div class="grid">
    <div class="chip"><b>🛏️</b> Weighted Blanket</div>
    <div class="chip"><b>🍪</b> Cookie Communion</div>
    <div class="chip"><b>🔮</b> Cosmic Prophet</div>
    <div class="chip"><b>🌟</b> Hyper Mascot</div>
    <div class="chip"><b>🌙</b> Cosmic Bedtime</div>
    <div class="chip"><b>🙇</b> Apology Loop</div>
  </div>
</div>
<div class="foot">martinbowling · qwen-neuron-audit</div>
</body>
</html>
