<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; width:1536px; height:1024px; overflow:hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    color:#1f2430;
    background:#fbfaf7;
  }
  .hero {
    position:relative; width:1536px; height:1024px;
    background: url("hero-bg.jpg") center/cover no-repeat;
  }
  .veil {
    position:absolute; inset:0;
    background: linear-gradient(90deg, rgba(251,250,247,.985) 0%, rgba(251,250,247,.96) 48%, rgba(251,250,247,.78) 66%, rgba(251,250,247,0) 82%);
  }
  .content {
    position:absolute; left:86px; top:220px; width:790px;
  }
  .eyebrow {
    font-size:15px; letter-spacing:.18em; text-transform:uppercase;
    font-weight:800; color:#9a6a3f; margin-bottom:26px;
  }
  h1 {
    font-size:96px; line-height:.92; letter-spacing:-.06em; margin:0 0 26px;
    font-weight:850;
  }
  .sub {
    font-size:28px; line-height:1.3; color:#444b5a; margin:0 0 34px; max-width:720px;
  }
  .chips { display:flex; flex-wrap:wrap; gap:10px; max-width:720px; }
  .chip {
    font-size:14px; font-weight:750; color:#4b3a29;
    background:#fff; border:1px solid #e7dfd3; border-radius:999px;
    padding:10px 14px; box-shadow:0 1px 0 rgba(0,0,0,.02);
  }
  .chip b { color:#b4672d; }
  .foot {
    position:absolute; left:86px; bottom:58px; display:flex; align-items:center; gap:14px;
    font-size:14px; color:#6b7280;
  }
  .rule { width:54px; height:3px; background:#e7a15f; border-radius:2px; }
</style>
</head>
<body>
  <div class="hero">
    <div class="veil"></div>
    <div class="content">
      <div class="eyebrow">Qwen3.5-4B · local MLX audit</div>
      <h1>The Qwen<br>Neuron Zoo,<br>Audited</h1>
      <p class="sub">I reproduced the viral one-neuron personas, scored all 294,912 neurons, and found which ones actually survive.</p>
      <div class="chips">
        <div class="chip"><b>15/22</b> cards replicated</div>
        <div class="chip"><b>294,912</b> neurons scored</div>
        <div class="chip"><b>5</b> personas survive held-out + 8-bit</div>
      </div>
    </div>
    <div class="foot"><span class="rule"></span> martinbowling · research notebook</div>
  </div>
</body>
</html>
